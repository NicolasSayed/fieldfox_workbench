[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldfox-workbench"
version = "0.1.3"
description = "Lightweight FieldFox Ethernet, recording, trace and screenshot desktop tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.8,<4", "scipy>=1.11,<2", "Pillow>=10,<13", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6.10,<7"]

[project.gui-scripts]
fieldfox-workbench = "fieldfox_workbench.app:main"

[project.scripts]
fieldfox-recording = "fieldfox_recording.__main__:main"
fieldfox-browser = "fieldfox_browser.__main__:main"

[tool.setuptools.packages.find]
include = ["fieldfox_workbench*", "fieldfox_recording*", "fieldfox_browser*"]

[tool.setuptools.package-data]
fieldfox_workbench = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
